{% extends "hr/base.html" %}
{% block title %}Mark Attendance{% endblock %}

{% block breadcrumb %}
 <div class="bg-white p-3 mb-4 rounded shadow-sm d-flex flex-column flex-md-row
     align-items-center justify-content-between">

    <div>
        <h4 class="fw-bold mb-0 text-success">Mark Attendance</h4>
        <small class="text-muted">Admin Mark Attendance</small>
    </div>

    <nav aria-label="breadcrumb" class="mt-3 mt-md-0">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{% url 'dashboard' %}" class="text-decoration-none text-success">
                    <i class="fa fa-home"></i> Home
                </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
                Mark Attendance
            </li>
        </ol>
    </nav>

</div>
{% endblock %}

{% block content %}

<div class="container-fluid">

  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-sm-12">
      <div class="widget-box">
        <div class="wc-title bg-success text-white p-3">
          <h4>Submit Your Attendance</h4>
        </div>
        <div class="widget-inner p-4">
                    <form method="post" class="mail-compose" id="attendance-form">
                        {% csrf_token %}
                         <div class="form-group">
                        {{form.employee}}
                         </div><br/>
                        <div class="form-group">
                        {{form.status}}
                         </div>

                         <!-- Hidden fields -->
                        <input type="hidden" id="id_latitude" name="latitude">
                        <input type="hidden" id="id_longitude" name="longitude">
                        <input type="hidden" id="id_address" name="address">
                        <input type="hidden" id="id_device_hash" name="device_hash">

                        <div class="form-group col-12 mt-3">
                            <button type="submit" class="btn btn-success">
                                <i class="ti-save"></i> Save Attendance
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const latInput = document.querySelector('input[name="latitude"]');
    const lngInput = document.querySelector('input[name="longitude"]');
    const addressInput = document.querySelector('input[name="address"]');

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            latInput.value = lat;
            lngInput.value = lng;

            // Reverse geocoding using OpenStreetMap Nominatim API
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
                const data = await response.json();
                addressInput.value = data.display_name || '';
            } catch (error) {
                console.error('Error fetching address:', error);
            }
        }, (error) => {
            console.error('Geolocation error:', error);
        });
    } else {
        alert('Geolocation is not supported by your browser.');
    }
});
</script>

{% endblock %}
