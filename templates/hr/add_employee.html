{% extends "hr/base.html" %}
{% block title %}Add Employee{% endblock %}


{% block breadcrumb %}
 <div class="bg-white p-3 mb-4 rounded shadow-sm d-flex flex-column flex-md-row
     align-items-center justify-content-between">

    <div>
        <h4 class="fw-bold mb-0 text-success">Add Employee</h4>
        <small class="text-muted">Employee Form</small>
    </div>

    <nav aria-label="breadcrumb" class="mt-3 mt-md-0">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{% url 'dashboard' %}" class="text-decoration-none text-success">
                    <i class="fa fa-home"></i> Home
                </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
                Add Employee
            </li>
        </ol>
    </nav>

</div>
{% endblock %}
{% block content %}
{% if request.user.is_superuser %}
    <div class="container-fluid">

        <div class="row">
            <div class="col-lg-12 m-b30">
                <div class="widget-box">
                    <div class="email-wrapper">
                        <div class="mail-list-container">
                            <form method="post" class="mail-compose">
                                {% csrf_token %}

                                {% include "form.html" %}

                                <div class="form-group col-12 mt-3">
                                    <button type="submit" class="btn btn-success">
                                        <i class="ti-save"></i> Save Employee
                                    </button>
                                    <a href="{% url 'employee_list' %}" class="btn btn-secondary">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

{% endif %}
{% endblock %}
