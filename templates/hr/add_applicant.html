{% extends "hr/base.html" %}
{% block title %}Add Applicant{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-4">Add Applicant</h1>
<div class="bg-green-100 text-green-900 p-6 rounded shadow max-w-lg">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="mt-4 bg-green-700 text-white px-4 py-2 rounded hover:bg-green-800">Save Applicant</button>
    </form>
</div>
{% endblock %}
