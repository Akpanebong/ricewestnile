{% with current_url=request.resolver_match.url_name %}

<!-- =====================================================
     DASHBOARD
===================================================== -->

<a href="{% url 'finance:dashboard' %}"
   class="sidebar-dashboard
   {% if current_url == 'dashboard' %}active{% endif %}">

    <span class="sidebar-nav-icon">
        <i class="fa-solid fa-house"></i>
    </span>

    <span class="sidebar-nav-text">
        Dashboard
    </span>

</a>


<!-- =====================================================
     CASH REQUISITIONS
===================================================== -->

<div class="sidebar-section">
    <span>CASH REQUISITIONS</span>
</div>

<a href="{% url 'finance:create_cash_req' %}"
   class="sidebar-dashboard
   {% if current_url == 'create_cash_req' %}active{% endif %}">

    <span class="sidebar-nav-icon">
        <i class="fa-solid fa-money-bill-wave"></i>
    </span>

    <span class="sidebar-nav-text">
        Fund Requisition
    </span>

</a>

<a href="{% url 'finance:list_cash_req' %}"
   class="sidebar-dashboard
   {% if current_url == 'list_cash_req' %}active{% endif %}">

    <span class="sidebar-nav-icon">
        <i class="fa-solid fa-list-check"></i>
    </span>

    <span class="sidebar-nav-text">
        Requisitions
    </span>

</a>

     LEDGER & REPORTING
===================================================== -->

<div class="sidebar-section">
    <span>LEDGER &amp; REPORTING</span>
</div>

<a href="{% url 'finance:ledger' %}"

   {% if current_url == 'ledger' %}active{% endif %}">

    </span>

    <span class="sidebar-nav-text">
        Financial Ledger
    </span>

    <span class="sidebar-tag sidebar-tag--new">New</span>

</a>

<a href="{% url 'finance:record_transaction' %}"
   class="sidebar-dashboard
   {% if current_url == 'record_transaction' %}active{% endif %}">

    <span class="sidebar-nav-icon">
        <i class="fa-solid fa-circle-plus"></i>
    </span>

    <span class="sidebar-nav-text">
        Record Transaction
    </span>

</a>

<a href="{% url 'finance:chart_of_accounts' %}"
   class="sidebar-dashboard
   {% if current_url == 'chart_of_accounts' %}active{% endif %}">

    <span class="sidebar-nav-icon">

</a>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div class="sidebar-section">
    <span>SETTINGS</span>
</div>

<a href="{% url 'currency_settings' %}"

   {% if current_url == 'currency_settings' %}active{% endif %}">

</a>

<a href="{% url 'procurement' %}"
   class="sidebar-dashboard">

    <span class="sidebar-nav-icon">
        <i class="fa-solid fa-cart-shopping"></i>
    </span>

    <span class="sidebar-nav-text">
        Procurement
    </span>

</a>
