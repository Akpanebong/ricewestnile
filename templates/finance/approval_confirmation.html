<div class="modal fade" id="actionModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">

      <div class="modal-header bg-warning">
        <h5 class="modal-title" id="modal-title">Confirm Action</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form id="action-form" method="post">
        {% csrf_token %}

        <div class="modal-body text-center">
          <p id="modal-message"></p>

          <!-- 🔴 REJECTION REASON FIELD -->
          <div id="reject-reason-box" class="mt-3 d-none">
            <label class="fw-bold">Reason for Rejection</label>
            <textarea name="reason"
                      id="reject-reason"
                      class="form-control"
                      placeholder="Enter reason..."
                      rows="3"></textarea>
          </div>

        </div>

        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="submit" id="confirm-btn" class="btn btn-success">
            Confirm
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const modal = new bootstrap.Modal(document.getElementById('actionModal'));
    const form = document.getElementById('action-form');
    const message = document.getElementById('modal-message');
    const title = document.getElementById('modal-title');
    const confirmBtn = document.getElementById('confirm-btn');
    const reasonBox = document.getElementById('reject-reason-box');
    const reasonInput = document.getElementById('reject-reason');

    // APPROVE
    document.querySelectorAll(".approve-btn").forEach(btn => {
        btn.addEventListener("click", function () {

            let url = this.dataset.url;
            let role = this.dataset.role;

            let msg = "Approve this request?";
            if (role === "finance") msg = "Finance will forward to Operations.";
            else if (role === "operations") msg = "Operations will forward to ED.";
            else if (role === "ed") msg = "Final approval. Cannot be undone.";

            form.action = url;
            message.innerText = msg;
            title.innerText = "Confirm Approval";

            confirmBtn.className = "btn btn-success";
            confirmBtn.innerText = "Approve";

            // hide reason
            reasonBox.classList.add("d-none");
            reasonInput.value = "";

            modal.show();
        });
    });

    // REJECT
    document.querySelectorAll(".reject-btn").forEach(btn => {
        btn.addEventListener("click", function () {

            let url = this.dataset.url;

            form.action = url;
            message.innerText = "Provide a reason before rejecting.";
            title.innerText = "Reject Requisition";

            confirmBtn.className = "btn btn-danger";
            confirmBtn.innerText = "Reject";

            // show reason
            reasonBox.classList.remove("d-none");

            modal.show();
        });
    });

    // VALIDATION before submit
    form.addEventListener("submit", function(e) {
        if (!reasonBox.classList.contains("d-none")) {
            if (reasonInput.value.trim() === "") {
                e.preventDefault();
                alert("Rejection reason is required.");
            }
        }
    });

});
</script>
