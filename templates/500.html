<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something went wrong — RICE WN</title>
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#f6f8f8; color:#0f172a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    padding:1.5rem;
  }
  .card{
    max-width:460px; width:100%; background:#ffffff; border:1px solid #e2e8f0;
    border-radius:16px; padding:2.25rem 2rem; text-align:center;
    box-shadow:0 10px 30px rgba(15,23,42,0.08);
  }
  .mark{
    width:56px; height:56px; margin:0 auto 1.1rem; border-radius:14px;
    background:#0e7a55; color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:1.6rem; font-weight:700;
  }
  h1{ font-size:1.3rem; margin:0 0 0.5rem; color:#0f172a; }
  p{ color:#475569; font-size:0.95rem; line-height:1.55; margin:0 0 1.5rem; }
  a.btn{
    display:inline-block; background:#0e7a55; color:#fff; text-decoration:none;
    font-weight:600; padding:0.65rem 1.4rem; border-radius:8px; font-size:0.92rem;
  }
  a.btn:hover{ background:#0a5f42; }
  .code{ color:#94a3b8; font-size:0.78rem; margin-top:1.5rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">!</div>
    <h1>Something went wrong on our side</h1>
    <p>The page didn't load correctly. This has been logged — try again in a moment, and contact your system administrator if it keeps happening.</p>
    <a class="btn" href="/">Back to the hub</a>
    <div class="code">Error 500</div>
  </div>
</body>
</html>
