{% if messages %}
  {% for message in messages %}
    <div class="toast align-items-center border-0 show mb-2{% if message.tags == 'success' %} text-bg-success{% elif message.tags == 'error' or message.tags == 'danger' %} text-bg-danger{% elif message.tags == 'warning' %} text-bg-warning{% elif message.tags == 'info' %} text-bg-info{% else %} text-bg-dark{% endif %}" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4500">
      <div class="d-flex">
        <div class="toast-body text-white">
          {{ message }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  {% endfor %}
{% endif %}

{% if form.non_field_errors %}
  <div class="toast align-items-center border-0 show text-bg-danger mb-2" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5500">
    <div class="d-flex">
      <div class="toast-body text-white">
        {% for error in form.non_field_errors %}
          <div>{{ error }}</div>
        {% endfor %}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
{% endif %}
