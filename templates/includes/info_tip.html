
<span
    class="info-tip{% if align == 'end' %} align-end{% endif %}"
    tabindex="0"
    role="button"
    aria-label="{{ text }}"
>
    <i class="fa-solid fa-circle-info" aria-hidden="true"></i>

    <span class="info-tip-bubble" role="tooltip" hidden="">
        {{ text }}
    </span>
</span>
