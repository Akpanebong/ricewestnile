{% if form.non_field_errors %}

<div class="alert alert-danger">

{{ form.non_field_errors }}

</div>

{% endif %}

{% for field in form %}

<div class="mb-3">

<label class="form-label">

{{ field.label }}

{% if field.field.required %}

<span class="text-danger">*</span>

{% endif %}

</label>

{{ field }}

{% if field.help_text %}

<div class="form-text">

{{ field.help_text }}

</div>

{% endif %}

{% if field.errors %}

<div class="text-danger small mt-1">

{{ field.errors }}

</div>

{% endif %}

</div>

{% endfor %}
