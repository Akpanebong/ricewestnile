{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}RICEWN M&E System{% endblock %}</title>

  <!-- CDN CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --ink: #13231d;
      --muted: #61736b;
      --line: #dfe8e2;
      --accent: #0d8b57;
      --accent-2: #003333;
      --surface: #ffffff;
      --surface-soft: #f8fbf9;
    }

    body {
      background:
        var(--surface-muted), transparent 32%),
        var(--surface-muted), transparent 36%),
        #f3f7f4;
      color: var(--ink);
      font-family: 'Source Sans 3', Calibri, sans-serif;
    }

    .page-wrapper {
      max-width: 1240px;
      margin: 32px auto;
      padding: 20px;
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 45px rgba(16, 32, 25, .12);
      padding: 30px;
    }

    .form-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 1.4rem;
      color: var(--ink);
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--line);
    }

    .form-label, label {
      color: #385148;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .form-control, .form-select {
      border-color: #d5e3dc;
      border-radius: 6px;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 .22rem rgba(13, 139, 87, .13);
    }

    .btn {
      border-radius: 6px;
      font-weight: 800;
    }

    .bg-light {
      background: var(--surface-soft) !important;
      border-color: var(--line) !important;
    }

    .section-note {
      color: var(--muted);
      font-size: .92rem;
    }

    .label-required:after {
      content: "*";
      color: red;
      margin-left: 3px;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body>

  <div class="page-wrapper">
    {% block content %}{% endblock %}
  </div>

  <!-- CDN JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
