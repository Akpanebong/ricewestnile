{% extends "garcis/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
        <div>
            <h3 class="mb-1">{{ object }}</h3>
            <p class="text-muted mb-0">{{ title }}</p>
        </div>
        <div class="quick-links">
            <a href="{% url update_url_name object.pk %}" class="btn btn-warning">Edit</a>
            <a href="{% url list_url_name %}" class="btn btn-outline-secondary">Back to List</a>
        </div>
    </div>

    <div class="card p-4">
        <div class="table-responsive">
            <table class="table align-middle">
                <tbody>
                    {% for label, value in fields %}
                    <tr>
                        <th style="width: 260px;">{{ label }}</th>
                        <td>{{ value|default:"-" }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
