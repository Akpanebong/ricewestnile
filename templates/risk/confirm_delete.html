{% extends "garcis/base.html" %}

{% block title %}Delete Risk{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="card p-4">
        <h4>Delete Risk</h4>
        <p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'risk_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
