{% extends "procurement/base.html" %}
{% block title %}Cancel Purchase Order{% endblock %}
{% block content %}
<main class="ttr-wrapper">
  <div class="container-fluid">
    <div class="card shadow-sm mt-4">
      <div class="card-body text-center p-5">
        <h4>Cancel Purchase Order: {{po}}</h4>
        <p class="text-muted">
          Are you sure you want to cancel <strong>{{ po.po_number }}</strong> for supplier <strong>{{ po.supplier }}</strong>?
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'purchase_order' %}" class="btn btn-secondary">No, Go Back</a>
            <button type="submit" class="btn btn-danger">Yes, Cancel PO</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock %}
