<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .header {
      background: #006400; /* dark green */
      color: white;
      padding: 15px;
      text-align: center;
    }
    .header img {
      height: 50px;
      vertical-align: middle;
      margin-right: 10px;
    }
    .container {
      background: white;
      margin: 20px auto;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .footer {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 10px;
    }
    .btn {
      background: #28a745;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      display: inline-block;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="https://share.google/images/fuSPExJ1Z4vQlcGts" alt="RICE WEST NILE Logo">
    <span style="font-size: 20px; font-weight: bold;">RICE WEST NILE</span>
  </div>

  <div class="container">
    <h2>🚨 New Situation Report Submitted</h2>
    <p><strong>Reporter:</strong> {{ reporter }}</p>
    <p><strong>Title:</strong> {{ title }}</p>
    <p><strong>Description:</strong> {{ description }}</p>
    <p><strong>Status:</strong> {{ status }}</p>

    <a href="{{ url }}" class="btn">View Report</a>
  </div>

  <div class="footer">
    &copy; {{ year }} RICE WEST NILE | HR System
  </div>
</body>
</html>
