{% extends "base.html" %}
{% block title %}Delete Confirmation{% endblock %}

{% block content %}
<main class="ttr-wrapper d-flex align-items-center justify-content-center" style="min-height:80vh;">
    <div class="container d-flex justify-content-center">
        <div class="col-md-6">
            <div class="widget-box text-center p-4 shadow-lg rounded" style="background:#f8fdf8;">

                <h2 class="text-danger mb-4">
                    <i class="fa fa-exclamation-triangle"></i> Delete {{delete|truncatechars:20}}
                </h2>

                <p class="mb-4">
                    Are you sure you want to delete <strong>{{ delete }}</strong>?
                </p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-danger">
                            <i class="fa fa-trash"></i> Yes, Delete
                        </button>
                        <a href="{{cancel_url}}" class="btn btn-secondary">
                            <i class="fa fa-arrow-left"></i> Cancel
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</main>
{% endblock %}
