{% extends 'garcis/base.html' %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm rounded-4">
        <div class="card-body">
            <h4 class="fw-bold mb-4">
                {% if object %}Edit Compliance Document{% else %}Upload Compliance Document{% endif %}
            </h4>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{% url 'compliance_doc_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
